<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eğlenceli Yılan Oyunu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #1e1e2e 0%, #0f0f17 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background-color: rgba(30, 30, 46, 0.8);
            border: 2px solid #313244;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #cba6f7;
            text-shadow: 0 2px 10px rgba(203, 166, 247, 0.3);
        }

        .tagline {
            font-size: 14px;
            color: #a6adc8;
            margin-bottom: 20px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            background-color: #181825;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: 600;
        }

        .score-val {
            color: #a6e3a1;
        }

        .high-score-val {
            color: #f9e2af;
        }

        canvas {
            border: 3px solid #45475a;
            border-radius: 12px;
            background-color: #11111b;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .controls-info {
            margin-top: 18px;
            color: #bac2de;
            font-size: 14px;
            text-align: center;
        }

        .key {
            background-color: #313244;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #45475a;
            font-size: 12px;
            display: inline-block;
            margin: 0 2px;
        }

        .restart-btn {
            margin-top: 15px;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: bold;
            color: #11111b;
            background-color: #89b4fa;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(137, 180, 250, 0.3);
        }

        .restart-btn:hover {
            background-color: #b4befe;
            transform: translateY(-2px);
        }

        .restart-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🐍 Yılan Oyunu</h1>
        <div class="tagline">En yüksek skoru yapmaya çalış!</div>

        <div class="scoreboard">
            <div>Skor: <span id="score" class="score-val">0</span></div>
            <div>En Yüksek: <span id="high-score" class="high-score-val">0</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls-info">
            Yön tuşlarını (<span class="key">↑</span> <span class="key">↓</span> <span class="key">←</span> <span class="key">→</span>) veya <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> tuşlarını kullanın.
        </div>

        <button class="restart-btn" id="restartBtn">Yeniden Başlat</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("high-score");
        const restartBtn = document.getElementById("restartBtn");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snake_high_score") || 0;
        highScoreElement.innerText = highScore;

        let gameInterval = null;
        let gameRunning = false;

        document.addEventListener("keydown", handleKeyPress);
        restartBtn.addEventListener("click", resetGame);

        function gameLoop() {
            moveSnake();
            if (checkGameOver()) {
                endGame();
                return;
            }
            clearCanvas();
            drawFood();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#11111b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                if (index === 0) {
                    ctx.fillStyle = "#89b4fa"; // Baş rengi
                } else {
                    ctx.fillStyle = "#a6e3a1"; // Gövde rengi
                }
                ctx.beginPath();
                ctx.roundRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2, 4);
                ctx.fill();
            });
        }

        function drawFood() {
            ctx.fillStyle = "#f38ba8";
            ctx.beginPath();
            ctx.arc((food.x * gridSize) + (gridSize / 2), (food.y * gridSize) + (gridSize / 2), (gridSize / 2) - 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.innerText = highScore;
                    localStorage.setItem("snake_high_score", highScore);
                }
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);
                valid = !snake.some(part => part.x === food.x && part.y === food.y);
            }
        }

        function checkGameOver() {
            const head = snake[0];
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            return false;
        }

        function handleKeyPress(event) {
            const key = event.key;

            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "w", "a", "s", "d"].includes(key)) {
                if (!gameRunning) {
                    gameRunning = true;
                    gameInterval = setInterval(gameLoop, 90);
                }
            }

            if ((key === "ArrowLeft" || key === "a" || key === "A") && dx === 0) { dx = -1; dy = 0; }
            if ((key === "ArrowUp" || key === "w" || key === "W") && dy === 0) { dx = 0; dy = -1; }
            if ((key === "ArrowRight" || key === "d" || key === "D") && dx === 0) { dx = 1; dy = 0; }
            if ((key === "ArrowDown" || key === "s" || key === "S") && dy === 0) { dx = 0; dy = 1; }
        }

        function endGame() {
            clearInterval(gameInterval);
            gameRunning = false;
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#f38ba8";
            ctx.font = "bold 28px 'Segoe UI', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("Oyun Bitti!", canvas.width / 2, canvas.height / 2 - 10);

            ctx.fillStyle = "#cdd6f4";
            ctx.font = "16px 'Segoe UI', sans-serif";
            ctx.fillText("Skorunuz: " + score, canvas.width / 2, canvas.height / 2 + 25);
        }

        function resetGame() {
            clearInterval(gameInterval);
            snake = [{ x: 10, y: 10 }];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            gameRunning = false;
            generateFood();
            clearCanvas();
            drawSnake();
            drawFood();
        }

        resetGame();
    </script>
</body>
</html>
